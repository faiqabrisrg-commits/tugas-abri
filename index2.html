<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2</title>
    
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <form action="" method="post">
        <!-- Section Akun -->
        <fieldset>
            <legend>Akun</legend>
            
            <div class="form-group">
                <label for="username">Username</label>
                <!-- Input Type Text -->
                <input type="text" id="username" name="username" placeholder="Masukkan username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <!-- Input Type Password -->
                <input type="password" id="password" name="password" placeholder="Masukkan password">
            </div>
            
            <div class="form-group">
                <label for="konfirmasi">Konfirmasi Password</label>
                <input type="password" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password">
            </div>
        </fieldset>

        
        <fieldset>
            <legend>Data Diri</legend>

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <!-- Input Type Text -->
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap">
            </div>

    

            <div class="form-group align-top">
                <label>Jenis Kelamin</label>
                <div class="options-group">
                    <!-- Radio Button -->
                    <label><input type="radio" name="jk" value="Pria"> Pria</label>
                    <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
                </div>
            </div>

            <div class="form-group align-top">
                <label>Informasi Yang Disukai</label>
                <div class="options-group">
                    <!-- Checkbox -->
                    <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                    <label><input type="checkbox" name="hobi[]" value="Travelling"> Travelling</label>
                    <label><input type="checkbox" name="hobi[]" value="Kesehatan"> Kesehatan</label>
                </div>
            </div>

           
            
            <button type="submit">Daftar</button>
            <button type="reset">Reset</button>
            <br></br>
             
        </div>
    </form>
   

</body>
</html>
